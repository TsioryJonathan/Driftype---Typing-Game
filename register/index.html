<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../src/assets/noBg.png" type="image/x-icon">
    <title>Driftype - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="/src/css/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
      :root {
        --bg-deep: #1C1108;
        --bg-mid: #24150B;
        --bg-surface: #2C1A0E;
        --orange: #D96B27;
        --orange-light: #E8792E;
        --cream: #F3E6D0;
        --cream-muted: #E8D6BC;
        --text-muted: #B9A895;
        --text-dim: #806F5D;
        --border: rgba(243,230,208,0.08);
        --incorrect: #E85D4A;
      }
      body {
        font-family: 'Space Grotesk', sans-serif;
        background: var(--bg-deep);
        color: var(--cream);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .auth-card {
        width: 100%;
        max-width: 400px;
        background: var(--bg-mid);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2.5rem 2rem;
      }
      .auth-logo {
        font-family: 'Fraunces', serif;
        font-weight: 700;
        font-size: 1.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        text-align: center;
        margin-bottom: 0.5rem;
        color: var(--cream);
      }
      .auth-logo span { color: var(--orange); }
      .auth-subtitle {
        font-size: 0.8125rem;
        text-align: center;
        color: var(--text-muted);
        margin-bottom: 2rem;
      }
      #errorMessage {
        display: none;
        text-align: center;
        font-size: 0.8125rem;
        color: var(--incorrect);
        margin-top: 1rem;
        padding: 0.5rem;
        border-radius: 2px;
      }
      .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.8125rem;
        color: var(--text-dim);
      }
      .auth-footer a {
        color: var(--orange);
        text-decoration: none;
        font-weight: 500;
      }
      .auth-footer a:hover { color: var(--orange-light); }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div id="logo" class="auth-logo"></div>
      <p class="auth-subtitle">Create your account</p>

      <form id="registerForm"></form>

      <div id="errorMessage"></div>

      <p class="auth-footer">
        Already have an account? <a href="/login">Log in</a>
      </p>
    </div>

    <script type="module" src="../src/components/js/pages/register.js"></script>
    <script src="../src/components/js/appearance.js"></script>
    <script>loadAppearanceSettings();</script>
  </body>
</html>
