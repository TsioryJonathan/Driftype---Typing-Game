<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driftype - Settings</title>
    <link rel="shortcut icon" href="/src/assets/noBg.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="/src/css/output.css" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    >
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"
      integrity="sha512-b+nQTCdtTBIRIbraqNEwsjB6UvL3UEMkXnhzd8awtCYh0Kcsjl9uEgwVFVbhoj3uu1DO1ZMacNvLoyJJiNfcvg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>
    <script src="https://unpkg.com/i18next@22.4.15/dist/umd/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2.2.0/i18nextHttpBackend.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <style>
      :root {
        --bg-deep: #1C1108;
        --bg-mid: #24150B;
        --bg-surface: #2C1A0E;
        --orange: #D96B27;
        --orange-light: #E8792E;
        --orange-bright: #F28A3D;
        --cream: #F3E6D0;
        --cream-muted: #E8D6BC;
        --text-muted: #B9A895;
        --text-dim: #806F5D;
        --border: rgba(243,230,208,0.08);
        --border-accent: rgba(232,121,46,0.20);
      }

      body {
        font-family: 'Space Grotesk', sans-serif;
        background: var(--bg-deep);
        color: var(--cream);
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 256px 256px;
        pointer-events: none;
        z-index: 9999;
      }

      .toggle-track {
        width: 44px;
        height: 24px;
        border-radius: 12px;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        position: relative;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
        flex-shrink: 0;
      }

      .toggle-track::after {
        content: '';
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--cream-muted);
        position: absolute;
        top: 2px;
        left: 2px;
        transition: transform 0.2s, background 0.2s;
      }

      input[type="checkbox"]:checked + .toggle-track {
        background: var(--orange);
        border-color: var(--orange);
      }

      input[type="checkbox"]:checked + .toggle-track::after {
        transform: translateX(20px);
        background: #fff;
      }

      input[type="checkbox"]:focus-visible + .toggle-track {
        outline: 2px solid var(--orange-light);
        outline-offset: 2px;
      }

      .settings-input {
        width: 100%;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 10px 14px;
        color: var(--cream);
        font-family: 'Space Grotesk', sans-serif;
        font-size: 14px;
        transition: border-color 0.2s;
      }

      .settings-input:focus {
        outline: none;
        border-color: var(--orange);
      }

      .settings-input::placeholder {
        color: var(--text-dim);
      }

      .settings-select {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px 12px;
        color: var(--cream);
        font-family: 'Space Grotesk', sans-serif;
        font-size: 14px;
        cursor: pointer;
        appearance: none;
        background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23B9A895' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 12px center;
        padding-right: 32px;
        transition: border-color 0.2s;
      }

      .settings-select:focus {
        outline: none;
        border-color: var(--orange);
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 0;
        cursor: pointer;
        user-select: none;
        transition: color 0.2s;
      }

      .section-header:hover {
        color: var(--orange-light);
      }

      .section-divider {
        height: 1px;
        background: var(--border);
      }

      #toast-success {
        background: var(--orange);
        color: #fff;
        padding: 12px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
      }

      #toast-success.show {
        opacity: 1;
        pointer-events: auto;
      }

      .nav-link {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        transition: color 0.2s;
        cursor: pointer;
        text-decoration: none;
      }

      .nav-link:hover {
        color: var(--orange);
      }

      .nav-link.active {
        color: var(--orange);
      }

      @media (max-width: 640px) {
        .settings-container {
          padding-left: 16px;
          padding-right: 16px;
        }
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header
      class="sticky top-0 backdrop-blur-md flex items-center justify-between px-6 lg:px-10 h-[60px] z-50"
      style="background: rgba(28,17,8,0.85); border-bottom: 1px solid var(--border);"
    >
      <!-- Logo -->
      <a href="/" class="flex items-center gap-1 text-xl font-bold tracking-tight" style="font-family: 'Fraunces', serif;">
        <span style="color: var(--cream);">DRIF</span><span style="color: var(--orange);">TYPE</span>
      </a>

      <!-- Nav bar (logged in) -->
      <nav class="hidden md:flex items-center gap-8">
        <a href="/dashboard" class="nav-link" id="practice-btn">Play</a>
        <a href="/statistics" class="nav-link" id="stat-btn">Statistics</a>
        <a href="/profile" class="nav-link">Profile</a>
      </nav>

      <!-- Spacer for centering -->
      <div class="hidden md:block w-20"></div>

      <!-- Avatar / User menu -->
      <div class="relative flex items-center" id="user-menu-container">
        <button
          id="user-menu-button"
          class="flex items-center gap-3 cursor-pointer group"
        >
          <div
            class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold"
            style="background: var(--bg-surface); border: 1px solid var(--border-accent); color: var(--orange); font-family: 'Fraunces', serif;"
          >
            <img
              id="avatar-img"
              src="https://i.pravatar.cc/40"
              alt="Avatar"
              class="w-8 h-8 rounded-full"
            >
          </div>
          <span class="text-sm hidden sm:inline" id="nav_username">
            <span class="flex justify-center items-center">
              <span
                class="w-5 h-5 border-2 border-t-[var(--orange)] rounded-full animate-spin"
                style="border-color: var(--text-dim); border-top-color: var(--orange);"
              ></span>
            </span>
          </span>
          <i class="fa-solid fa-angle-down text-xs" style="color: var(--text-dim);"></i>
        </button>
        <div
          id="dropdown"
          class="absolute right-0 top-full mt-2 w-40 hidden z-50 overflow-hidden"
          style="background: var(--bg-mid); border: 1px solid var(--border); border-radius: 4px;"
        >
          <a
            href="/profile"
            class="flex justify-between items-center px-3 py-2 text-sm transition-colors"
            style="color: var(--cream-muted);"
            onmouseover="this.style.background='var(--orange)'; this.style.color='#fff';"
            onmouseout="this.style.background=''; this.style.color='var(--cream-muted)';"
          >
            Profile
            <i class="fas fa-user text-xs"></i>
          </a>
          <button
            class="w-full text-left flex justify-between items-center px-3 py-2 text-sm transition-colors"
            style="color: var(--cream-muted);"
            onmouseover="this.style.background='var(--orange)'; this.style.color='#fff';"
            onmouseout="this.style.background=''; this.style.color='var(--cream-muted)';"
            id="logout-btn"
          >
            Sign out
            <i class="fas fa-right-from-bracket text-xs"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Mobile nav -->
    <nav class="md:hidden flex justify-center gap-6 py-3" style="border-bottom: 1px solid var(--border); background: var(--bg-deep);">
      <a href="/dashboard" class="nav-link" id="practice-btn-mobile">Play</a>
      <a href="/statistics" class="nav-link" id="stat-btn-mobile">Statistics</a>
      <a href="/profile" class="nav-link">Profile</a>
    </nav>

    <!-- Main Content -->
    <main class="settings-container max-w-2xl mx-auto py-10 px-4 sm:px-6">
      <!-- Page Title -->
      <h1
        class="text-2xl font-bold mb-10 tracking-tight"
        style="font-family: 'Space Grotesk', sans-serif; color: var(--cream);"
      >SETTINGS</h1>

      <!-- Profile Settings -->
      <section>
        <div class="section-divider"></div>
        <button
          onclick="toggleSection('profile-settings')"
          class="section-header w-full"
          style="color: var(--cream);"
        >
          <span class="flex items-center gap-3">
            <i class="fas fa-user text-sm" style="color: var(--orange);"></i>
            <span class="font-semibold text-sm uppercase tracking-wider">Profile</span>
          </span>
          <i
            id="chevron-profile-settings"
            class="fas fa-chevron-down text-xs transition-transform duration-300"
            style="color: var(--text-dim);"
          ></i>
        </button>
        <div
          id="profile-settings"
          class="max-h-0 overflow-hidden transition-all duration-500 ease-in-out"
        >
          <div class="space-y-5 pb-4">
            <div class="flex items-center gap-4 mb-4">
              <div
                class="w-14 h-14 rounded-full flex items-center justify-center text-lg font-bold"
                style="background: var(--orange); color: #fff; font-family: 'Fraunces', serif;"
              ></div>
              <div>
                <p class="text-sm font-medium" id="username-label" style="color: var(--cream);"></p>
                <p class="text-xs" id="email-label" style="color: var(--text-dim);"></p>
              </div>
            </div>
            <div class="space-y-4">
              <div class="flex flex-col gap-2">
                <label class="text-xs font-medium uppercase tracking-wider" style="color: var(--text-dim);" for="username-input">
                  Username
                </label>
                <input
                  type="text"
                  id="username-input"
                  class="settings-input"
                >
              </div>
              <div class="flex flex-col gap-2">
                <label class="text-xs font-medium uppercase tracking-wider" style="color: var(--text-dim);" for="email">
                  Email
                </label>
                <input
                  type="email"
                  id="email"
                  class="settings-input"
                >
              </div>
              <button
                class="w-full mt-2 px-4 py-2.5 text-sm font-medium rounded transition-colors flex items-center justify-center gap-2"
                style="background: var(--orange); color: #fff;"
                onmouseover="this.style.background='var(--orange-light)';"
                onmouseout="this.style.background='var(--orange)';"
                id="user-info-update-btn"
              >
                <i class="fas fa-save"></i>
                <span>Save Changes</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Game Preferences -->
      <section>
        <div class="section-divider"></div>
        <button
          onclick="toggleSection('game-preferences')"
          class="section-header w-full"
          style="color: var(--cream);"
        >
          <span class="flex items-center gap-3">
            <i class="fas fa-keyboard text-sm" style="color: var(--orange);"></i>
            <span class="font-semibold text-sm uppercase tracking-wider">Game Preferences</span>
          </span>
          <i
            id="chevron-game-preferences"
            class="fas fa-chevron-down text-xs transition-transform duration-300"
            style="color: var(--text-dim);"
          ></i>
        </button>
        <div
          id="game-preferences"
          class="max-h-0 overflow-hidden transition-all duration-500 ease-in-out"
        >
          <div class="space-y-5 pb-4">
            <div class="flex items-center justify-between">
              <label class="text-sm" for="realTimeToggle" style="color: var(--cream-muted);">Real-time stats</label>
              <label class="flex items-center cursor-pointer gap-3">
                <input id="realTimeToggle" type="checkbox" class="sr-only">
                <div class="toggle-track"></div>
              </label>
            </div>
            <div class="flex items-center justify-between">
              <label class="text-sm" for="instantFeedbackToggle" style="color: var(--cream-muted);">Instant feedback</label>
              <label class="flex items-center cursor-pointer gap-3">
                <input id="instantFeedbackToggle" type="checkbox" class="sr-only" checked>
                <div class="toggle-track"></div>
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- Sound & Feedback -->
      <section>
        <div class="section-divider"></div>
        <button
          onclick="toggleSection('sound-feedback')"
          class="section-header w-full"
          style="color: var(--cream);"
        >
          <span class="flex items-center gap-3">
            <i class="fas fa-volume-high text-sm" style="color: var(--orange);"></i>
            <span class="font-semibold text-sm uppercase tracking-wider">Sound & Feedback</span>
          </span>
          <i
            id="chevron-sound-feedback"
            class="fas fa-chevron-down text-xs transition-transform duration-300"
            style="color: var(--text-dim);"
          ></i>
        </button>
        <div
          id="sound-feedback"
          class="max-h-0 overflow-hidden transition-all duration-500 ease-in-out"
        >
          <div class="space-y-5 pb-4">
            <div class="flex items-center justify-between">
              <label class="text-sm" for="enableSoundsToggle" style="color: var(--cream-muted);">Enable sounds</label>
              <label class="flex items-center cursor-pointer gap-3">
                <input id="enableSoundsToggle" type="checkbox" class="sr-only" checked>
                <div class="toggle-track"></div>
              </label>
            </div>
            <div class="flex items-center justify-between">
              <label class="text-sm" for="keyboardSoundsToggle" style="color: var(--cream-muted);">Keyboard sounds</label>
              <label class="flex items-center cursor-pointer gap-3">
                <input id="keyboardSoundsToggle" type="checkbox" class="sr-only" checked>
                <div class="toggle-track"></div>
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- Appearance -->
      <section>
        <div class="section-divider"></div>
        <button
          onclick="toggleSection('appearance-settings')"
          class="section-header w-full"
          style="color: var(--cream);"
        >
          <span class="flex items-center gap-3">
            <i class="fas fa-palette text-sm" style="color: var(--orange);"></i>
            <span class="font-semibold text-sm uppercase tracking-wider">Appearance</span>
          </span>
          <i
            id="chevron-appearance-settings"
            class="fas fa-chevron-down text-xs transition-transform duration-300"
            style="color: var(--text-dim);"
          ></i>
        </button>
        <div
          id="appearance-settings"
          class="max-h-0 overflow-hidden transition-all duration-500 ease-in-out"
        >
          <div class="space-y-5 pb-4">
            <div class="flex items-center justify-between">
              <span class="text-sm" style="color: var(--cream-muted);">Font size</span>
              <select
                class="settings-select"
                id="font-size-select"
              >
                <option value="sm">Small</option>
                <option value="md" selected>Medium</option>
                <option value="lg">Large</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <!-- Notifications -->
      <section>
        <div class="section-divider"></div>
        <button
          onclick="toggleSection('notification-settings')"
          class="section-header w-full"
          style="color: var(--cream);"
        >
          <span class="flex items-center gap-3">
            <i class="fas fa-bell text-sm" style="color: var(--orange);"></i>
            <span class="font-semibold text-sm uppercase tracking-wider">Notifications</span>
          </span>
          <i
            id="chevron-notification-settings"
            class="fas fa-chevron-down text-xs transition-transform duration-300"
            style="color: var(--text-dim);"
          ></i>
        </button>
        <div
          id="notification-settings"
          class="max-h-0 overflow-hidden transition-all duration-500 ease-in-out"
        >
          <div class="space-y-5 pb-4">
            <div class="flex items-center justify-between">
              <label class="text-sm" for="emailNotificationsToggle" style="color: var(--cream-muted);">Email notifications</label>
              <label class="flex items-center cursor-pointer gap-3">
                <input id="emailNotificationsToggle" type="checkbox" class="sr-only" checked>
                <div class="toggle-track"></div>
              </label>
            </div>
            <div class="flex items-center justify-between">
              <label class="text-sm" for="pushNotificationsToggle" style="color: var(--cream-muted);">Push notifications</label>
              <label class="flex items-center cursor-pointer gap-3">
                <input id="pushNotificationsToggle" type="checkbox" class="sr-only">
                <div class="toggle-track"></div>
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- Privacy -->
      <section>
        <div class="section-divider"></div>
        <button
          onclick="toggleSection('privacy-settings')"
          class="section-header w-full"
          style="color: var(--cream);"
        >
          <span class="flex items-center gap-3">
            <i class="fas fa-shield-halved text-sm" style="color: var(--orange);"></i>
            <span class="font-semibold text-sm uppercase tracking-wider">Privacy</span>
          </span>
          <i
            id="chevron-privacy-settings"
            class="fas fa-chevron-down text-xs transition-transform duration-300"
            style="color: var(--text-dim);"
          ></i>
        </button>
        <div
          id="privacy-settings"
          class="max-h-0 overflow-hidden transition-all duration-500 ease-in-out"
        >
          <div class="space-y-5 pb-4">
            <div class="flex items-center justify-between">
              <label class="text-sm" for="profileVisibleToggle" style="color: var(--cream-muted);">Profile visible</label>
              <label class="flex items-center cursor-pointer gap-3">
                <input id="profileVisibleToggle" type="checkbox" class="sr-only" checked>
                <div class="toggle-track"></div>
              </label>
            </div>
            <div class="flex items-center justify-between">
              <label class="text-sm" for="activityStatusToggle" style="color: var(--cream-muted);">Activity status</label>
              <label class="flex items-center cursor-pointer gap-3">
                <input id="activityStatusToggle" type="checkbox" class="sr-only">
                <div class="toggle-track"></div>
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- Bottom spacer -->
      <div class="section-divider mt-2"></div>
    </main>

    <!-- Toast -->
    <div
      id="toast-success"
      class="hidden fixed bottom-4 right-4 shadow-lg transition-opacity duration-300 z-50"
    >
      Modifications enregistrées !
    </div>

    <!-- Hidden element for navBarRedirection.js compatibility -->
    <button id="setting-btn" class="hidden"></button>

    <!-- Scripts -->
    <script
      src="../src/components/js/pages/SettingPageScript/userInfoUpdate.js"
      type="module"
    ></script>
    <script
      src="../src/components/js/pages/SettingPageScript/sectionToggle.js"
      type="module"
    ></script>
    <script src="../src/components/js/pages/dashboard.js" type="module"></script>
    <script src="../src/components/js/pages/userInfofetch.js" type="module"></script>
    <script src="../src/components/js/navBarRedirection.js" type="module"></script>
    <script src="../src/components/js/soundAndFeedback.js"></script>
    <script src="../src/components/js/appearance.js"></script>
    <script src="../src/components/js/gamePreferences.js"></script>
    <script src="../src/components/js/notificationAndPrivacy.js"></script>
    <script src="../src/components/js/pages/settings.js"></script>
    <script>
      if (typeof saveGamePreferences === 'undefined') console.error('saveGamePreferences missing');
      if (typeof saveSoundAndFeedbackSettings === 'undefined') console.error('saveSoundAndFeedbackSettings missing');
      if (typeof saveAppearanceSettings === 'undefined') console.error('saveAppearanceSettings missing');
      if (typeof saveNotificationAndPrivacySettings === 'undefined') console.error('saveNotificationAndPrivacySettings missing');
    </script>

    <script>loadAppearanceSettings();</script>
    <script>loadSoundAndFeedbackSettings();</script>
    <script>loadGamePreferences();</script>
    <script>loadNotificationAndPrivacySettings();</script>

    <script src="../src/components/js/logoutFunc.js" type="module"></script>
    <script src="../src/components/js/userMenu.js"></script>
  </body>
</html>
