<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driftype - Statistics</title>
    <link rel="shortcut icon" href="/src/assets/noBg.png" type="image/x-icon">
    <link href="/src/css/output.css" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flag-icon-css/css/flag-icon.min.css"
    >
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    >
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"
      integrity="sha512-b+nQTCdtTBIRIbraqNEwsjB6UvL3UEMkXnhzd8awtCYh0Kcsjl9uEgwVFVbhoj3uu1DO1ZMacNvLoyJJiNfcvg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>
    <script src="https://unpkg.com/i18next@22.4.15/dist/umd/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2.2.0/i18nextHttpBackend.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-deep: #1C1108;
        --bg-mid: #24150B;
        --bg-surface: #2C1A0E;
        --orange: #D96B27;
        --orange-light: #E8792E;
        --orange-bright: #F28A3D;
        --cream: #F3E6D0;
        --cream-muted: #E8D6BC;
        --text-muted: #B9A895;
        --text-dim: #806F5D;
        --border: rgba(243,230,208,0.08);
        --border-accent: rgba(232,121,46,0.20);
        --correct: #D96B27;
        --incorrect: #E85D4A;
        --font-fraunces: 'Fraunces', serif;
        --font-space-grotesk: 'Space Grotesk', sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: var(--font-space-grotesk);
        background: var(--bg-deep);
        color: var(--cream);
        min-height: 100vh;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 256px 256px;
        pointer-events: none;
        z-index: 9999;
      }

      /* Navbar */
      .navbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        height: 60px;
        background: rgba(28,17,8,0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }

      .navbar-logo {
        font-family: var(--font-fraunces);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--cream);
        text-decoration: none;
      }

      .navbar-logo span {
        color: var(--orange);
      }

      .navbar-links {
        display: flex;
        gap: 32px;
        align-items: center;
      }

      .navbar-links a {
        font-family: var(--font-space-grotesk);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
        text-decoration: none;
        transition: color 0.2s;
      }

      .navbar-links a:hover {
        color: var(--cream);
      }

      .navbar-links a.active {
        color: var(--orange);
      }

      .navbar-avatar {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 9999px;
        padding: 4px 12px 4px 4px;
        cursor: pointer;
        transition: border-color 0.2s;
      }

      .avatar-btn:hover {
        border-color: var(--border-accent);
      }

      .avatar-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--bg-mid);
        border: 1.5px solid var(--orange);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-fraunces);
        font-size: 14px;
        font-weight: 600;
        color: var(--orange);
        overflow: hidden;
      }

      .avatar-circle img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .dropdown {
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        width: 160px;
        background: var(--bg-mid);
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
        z-index: 100;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      }

      .dropdown a,
      .dropdown button {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 8px 12px;
        font-size: 13px;
        color: var(--cream);
        text-decoration: none;
        border: none;
        background: none;
        cursor: pointer;
        transition: background 0.15s;
        text-align: left;
      }

      .dropdown a:hover,
      .dropdown button:hover {
        background: var(--orange);
        color: var(--cream);
      }

      /* Main */
      .main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 40px 80px;
      }

      /* Title */
      .page-title {
        font-family: var(--font-space-grotesk);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 40px;
      }

      /* Top Stats */
      .top-stats {
        display: flex;
        gap: 64px;
        margin-bottom: 48px;
      }

      .stat-block {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .stat-label {
        font-family: var(--font-space-grotesk);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      .stat-number {
        font-family: var(--font-fraunces);
        font-size: 64px;
        font-weight: 700;
        color: var(--cream);
        line-height: 1;
        font-variation-settings: 'opsz' 144;
      }

      /* Secondary stats */
      .secondary-stats {
        display: flex;
        gap: 40px;
        margin-bottom: 48px;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--border);
      }

      .secondary-stat {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .secondary-stat-value {
        font-family: var(--font-fraunces);
        font-size: 20px;
        font-weight: 600;
        color: var(--cream-muted);
      }

      .secondary-stat-label {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      /* Section heading */
      .section-heading {
        font-family: var(--font-space-grotesk);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 20px;
      }

      /* Chart */
      .chart-container {
        margin-bottom: 48px;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--border);
      }

      #chart {
        width: 100%;
        height: 320px;
      }

      /* Table */
      .table-container {
        overflow-x: auto;
      }

      .sessions-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .sessions-table thead {
        border-bottom: 1px solid var(--border);
      }

      .sessions-table th {
        font-family: var(--font-space-grotesk);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
        padding: 12px 16px;
        text-align: left;
        white-space: nowrap;
      }

      .sessions-table td {
        padding: 12px 16px;
        color: var(--cream-muted);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }

      .sessions-table tbody tr {
        transition: background 0.15s;
      }

      .sessions-table tbody tr:hover {
        background: var(--bg-surface);
      }

      /* Login toast */
      #login-warning-toast {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 50;
        display: none;
        align-items: center;
        gap: 12px;
        background: var(--bg-mid);
        border: 1px solid var(--border-accent);
        padding: 16px 20px;
        border-radius: 4px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        transition: opacity 0.3s;
      }

      #login-warning-toast.show {
        display: flex;
        opacity: 1;
      }

      #login-warning-toast span {
        font-size: 13px;
        color: var(--cream-muted);
      }

      #login-warning-toast i {
        color: var(--orange-bright);
      }

      #login-warning-toast button {
        background: var(--orange);
        color: var(--cream);
        border: none;
        padding: 6px 16px;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      #login-warning-toast button:hover {
        background: var(--orange-light);
      }

      /* Loading spinner */
      .loader {
        width: 20px;
        height: 20px;
        border: 3px solid var(--border);
        border-top-color: var(--orange);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Mobile hamburger */
      .hamburger {
        display: none;
        flex-direction: column;
        gap: 4px;
        cursor: pointer;
        background: none;
        border: none;
        padding: 4px;
      }

      .hamburger span {
        width: 20px;
        height: 2px;
        background: var(--cream);
        transition: 0.2s;
      }

      /* Mobile nav overlay */
      .mobile-nav {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background: var(--bg-deep);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
      }

      .mobile-nav.open {
        display: flex;
      }

      .mobile-nav a {
        font-family: var(--font-space-grotesk);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
        text-decoration: none;
        transition: color 0.2s;
      }

      .mobile-nav a:hover,
      .mobile-nav a.active {
        color: var(--orange);
      }

      .mobile-nav-close {
        position: absolute;
        top: 20px;
        right: 24px;
        background: none;
        border: none;
        color: var(--cream);
        font-size: 24px;
        cursor: pointer;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .navbar {
          padding: 0 20px;
        }

        .navbar-links {
          display: none;
        }

        .hamburger {
          display: flex;
        }

        .main {
          padding: 24px 20px 60px;
        }

        .top-stats {
          flex-direction: column;
          gap: 32px;
        }

        .stat-number {
          font-size: 48px;
        }

        .secondary-stats {
          flex-wrap: wrap;
          gap: 20px;
        }

        #chart {
          height: 240px;
        }

        .sessions-table th,
        .sessions-table td {
          padding: 10px 12px;
          font-size: 12px;
        }
      }

      @media (max-width: 390px) {
        .stat-number {
          font-size: 40px;
        }

        .navbar-avatar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <header class="navbar">
      <a href="/" class="navbar-logo">DRIF<span>TYPE</span></a>

      <nav class="navbar-links">
        <a href="/dashboard" id="practice-btn">Play</a>
        <a href="/statistics" id="stat-btn" class="active">Statistics</a>
        <a href="/profile">Profile</a>
      </nav>

      <button class="hamburger" id="hamburger-btn" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="navbar-avatar" id="user-menu-container">
        <button class="avatar-btn" id="user-menu-button">
          <div class="avatar-circle" id="avatar-img">
            <span id="nav_username"></span>
          </div>
        </button>
        <div id="dropdown" class="dropdown" style="display:none;">
          <a href="/profile">Profile <i class="fas fa-user"></i></a>
          <button id="logout-btn">Sign out <i class="fas fa-right-from-bracket"></i></button>
        </div>
      </div>
    </header>

    <!-- Mobile nav -->
    <div class="mobile-nav" id="mobile-nav">
      <button class="mobile-nav-close" id="mobile-nav-close">&times;</button>
      <a href="/dashboard">Play</a>
      <a href="/statistics" class="active">Statistics</a>
      <a href="/profile">Profile</a>
    </div>

    <!-- Main -->
    <main class="main">
      <h1 class="page-title">Statistics</h1>

      <!-- Top Stats -->
      <div class="top-stats">
        <div class="stat-block">
          <span class="stat-label">Avg WPM</span>
          <div class="stat-number" id="avg-wpm">
            <div class="loader"></div>
          </div>
        </div>
        <div class="stat-block">
          <span class="stat-label">Best WPM</span>
          <div class="stat-number" id="max-wpm">
            <div class="loader"></div>
          </div>
        </div>
      </div>

      <!-- Secondary Stats -->
      <div class="secondary-stats">
        <div class="secondary-stat">
          <span class="secondary-stat-value" id="avg-accuracy">
            <div class="loader"></div>
          </span>
          <span class="secondary-stat-label">Avg Accuracy</span>
        </div>
        <div class="secondary-stat">
          <span class="secondary-stat-value" id="complete-test">
            <div class="loader"></div>
          </span>
          <span class="secondary-stat-label">Tests Completed</span>
        </div>
      </div>

      <!-- Performance Over Time -->
      <p class="section-heading">Performance Over Time</p>
      <div class="chart-container">
        <div id="chart"></div>
      </div>

      <!-- Recent Sessions -->
      <p class="section-heading">Recent Sessions</p>
      <div class="table-container">
        <table class="sessions-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>WPM</th>
              <th>Accuracy</th>
              <th>Duration</th>
              <th>Difficulty</th>
              <th>Language</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr>
              <td><div class="loader"></div></td>
              <td><div class="loader"></div></td>
              <td><div class="loader"></div></td>
              <td><div class="loader"></div></td>
              <td><div class="loader"></div></td>
              <td><div class="loader"></div></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Hidden elements preserved for JS -->
      <div style="display:none;">
        <span id="leaderboard-avg-wpm"></span>
        <span id="leaderboard-avg-accuracy"></span>
        <span id="username"></span>
      </div>

      <!-- Login warning toast -->
      <div id="login-warning-toast">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Please Login To Continue</span>
        <button onclick="window.location.href='/login'">Login</button>
      </div>
    </main>

    <script type="module" src="../src/components/js/pages/dashboard.js"></script>
    <script src="../src/components/js/pages/userInfofetch.js" type="module"></script>
    <script src="../src/components/js/logoutFunc.js" type="module"></script>
    <script src="../src/components/js/userMenu.js"></script>
    <script src="../src/components/js/navBarRedirection.js" type="module"></script>
    <script src="../src/components/js/pages/StatPageScript/statGraph.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="../src/components/js/pages/StatPageScript/getOverallStat.js" type="module"></script>
    <script src="../src/components/js/pages/StatPageScript/getRecentStat.js" type="module"></script>
    <script src="../src/components/js/appearance.js"></script>
    <script>loadAppearanceSettings();</script>
    <script src="../src/components/js/gamePreferences.js"></script>
    <script>loadGamePreferences();</script>
    <script src="../src/components/js/soundAndFeedback.js"></script>
    <script>loadSoundAndFeedbackSettings();</script>
    <script src="../src/components/js/notificationAndPrivacy.js"></script>
    <script>loadNotificationAndPrivacySettings();</script>

    <script>
      // Mobile nav
      const hamburgerBtn = document.getElementById('hamburger-btn');
      const mobileNav = document.getElementById('mobile-nav');
      const mobileNavClose = document.getElementById('mobile-nav-close');

      hamburgerBtn?.addEventListener('click', () => mobileNav.classList.add('open'));
      mobileNavClose?.addEventListener('click', () => mobileNav.classList.remove('open'));

      // User menu dropdown toggle
      const userMenuContainer = document.getElementById('user-menu-container');
      const userMenuButton = document.getElementById('user-menu-button');
      const dropdown = document.getElementById('dropdown');

      userMenuButton?.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = dropdown.style.display !== 'none';
        dropdown.style.display = isOpen ? 'none' : 'block';
      });

      document.addEventListener('click', (e) => {
        if (!userMenuContainer.contains(e.target)) {
          dropdown.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
